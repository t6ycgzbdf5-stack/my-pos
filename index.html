<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My POS</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            margin: 0;
            background: #f3f4f6;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #222;
            color: white;

            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

        }


        .header-title {

            font-size: 24px;
            font-weight: bold;

        }


        .manage-button {

            padding: 10px 15px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

        }


        /* =========================
           MAIN LAYOUT
        ========================= */

        .container {

            display: flex;

            height: calc(100vh - 68px);

        }


        /* =========================
           PRODUCTS
        ========================= */

        .products {

            width: 60%;

            padding: 20px;

            overflow-y: auto;

        }


        .products h2 {

            margin-top: 0;

        }


        /* =========================
           BARCODE SCANNER
        ========================= */

        .barcode-scan-area {

            margin-bottom: 20px;

        }


        #barcodeScanner {

            width: 100%;

            padding: 15px;

            font-size: 18px;

            border: 2px solid #222;
            border-radius: 8px;

            margin-top: 0;

        }


        #barcodeScanner:focus {

            outline: none;

            border-color: #555;

        }


        .scanner-status {

            font-size: 13px;

            margin-top: 6px;

            color: #666;

        }


        /* =========================
           PRODUCT GRID
        ========================= */

        .product-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

        }


        .product {

            background: white;

            border: none;

            padding: 25px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 18px;

            text-align: left;

        }


        .product:hover {

            background: #e5e7eb;

        }


        .price {

            display: block;

            margin-top: 10px;

            font-weight: bold;

        }


        /* =========================
           CURRENT ORDER
        ========================= */

        .cart {

            width: 40%;

            background: white;

            padding: 20px;

            border-left: 1px solid #ddd;

            display: flex;
            flex-direction: column;

        }


        .cart h2 {

            margin-top: 0;

        }


        .cart-items {

            flex: 1;

            overflow-y: auto;

        }


        .cart-item {

            display: grid;

            grid-template-columns:
                1fr auto auto auto;

            align-items: center;

            gap: 15px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

        }


        .item-name {

            font-size: 17px;

            font-weight: bold;

        }


        .item-price {

            font-size: 13px;

            margin-top: 5px;

        }


        /* =========================
           QUANTITY BUTTONS
        ========================= */

        .quantity-controls {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .quantity-controls button {

            width: 32px;
            height: 32px;

            border: none;

            border-radius: 5px;

            font-size: 18px;

            cursor: pointer;

        }


        .quantity-controls span {

            min-width: 25px;

            text-align: center;

            font-weight: bold;

        }


        /* =========================
           REMOVE BUTTON
        ========================= */

        .remove-button {

            background: #d9534f;

            color: white;

            border: none;

            width: 35px;
            height: 35px;

            border-radius: 6px;

            font-size: 22px;

            cursor: pointer;

        }


        /* =========================
           PAYMENT
        ========================= */

        .total {

            margin-top: 20px;

            padding-top: 20px;

            border-top: 2px solid #222;

            font-size: 24px;

            font-weight: bold;

        }


        .payment-section {

            margin-top: 20px;

        }


        input {

            width: 100%;

            padding: 15px;

            font-size: 18px;

            margin-top: 10px;

        }


        .checkout {

            width: 100%;

            padding: 18px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        .change {

            margin-top: 15px;

            font-size: 20px;

            font-weight: bold;

        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;

            z-index: 1000;

        }


        .modal-content {

            background: white;

            width: 600px;

            max-width: 95%;
            max-height: 90vh;

            overflow-y: auto;

            padding: 25px;

            border-radius: 10px;

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .close-modal {

            border: none;

            background: none;

            font-size: 30px;

            cursor: pointer;

        }


        /* =========================
           PRODUCT FORM
        ========================= */

        .form-group {

            margin-top: 15px;

        }


        .form-group label {

            display: block;

            margin-bottom: 5px;

            font-weight: bold;

        }


        .form-group input {

            margin-top: 0;

        }


        .save-product {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 6px;

            background: #222;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        /* =========================
           PRODUCT MANAGEMENT
        ========================= */

        .product-list {

            margin-top: 30px;

        }


        .product-list h3 {

            border-bottom: 1px solid #ddd;

            padding-bottom: 10px;

        }


        .manage-product-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

        }


        .manage-product-info {

            flex: 1;

        }


        .manage-product-name {

            font-weight: bold;

            font-size: 17px;

        }


        .manage-product-details {

            font-size: 13px;

            margin-top: 5px;

        }


        .edit-button {

            background: #555;

            color: white;

            border: none;

            border-radius: 5px;

            padding: 8px 12px;

            cursor: pointer;

            margin-right: 8px;

        }


        .delete-button {

            background: #d9534f;

            color: white;

            border: none;

            border-radius: 5px;

            padding: 8px 12px;

            cursor: pointer;

        }


        /* =========================
           MOBILE / IPAD
        ========================= */

        @media (max-width: 768px) {

            .container {

                flex-direction: column;

                height: auto;

            }


            .products,
            .cart {

                width: 100%;

            }


            .products {

                min-height: 50vh;

            }


            .cart {

                border-left: none;

                border-top: 1px solid #ddd;

                min-height: 50vh;

            }


            .product-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .cart-item {

                gap: 8px;

                grid-template-columns:
                    1fr auto;

            }


            .quantity-controls {

                grid-column: 1 / 2;

            }


        }

    </style>

</head>



<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div class="header-title">

            🛒 MY POS

        </div>


        <button
            class="manage-button"
            onclick="openProductModal()"
        >

            MANAGE PRODUCTS

        </button>

    </div>



    <!-- =========================
         MAIN POS
    ========================= -->

    <div class="container">


        <!-- PRODUCTS -->

        <div class="products">


            <h2>Products</h2>


            <!-- BARCODE SCANNER -->

            <div class="barcode-scan-area">

                <input
                    type="text"
                    id="barcodeScanner"
                    placeholder="Tap here then scan barcode..."
                    autocomplete="off"
                >


                <div class="scanner-status">

                    Bluetooth barcode scanner ready

                </div>

            </div>


            <!-- PRODUCT GRID -->

            <div
                class="product-grid"
                id="productGrid"
            ></div>


        </div>



        <!-- =========================
             CURRENT ORDER
        ========================= -->

        <div class="cart">


            <h2>Current Order</h2>


            <div
                class="cart-items"
                id="cartItems"
            >

                <p>No items yet.</p>

            </div>



            <!-- TOTAL -->

            <div class="total">

                Total: ₱
                <span id="total">

                    0

                </span>

            </div>



            <!-- PAYMENT -->

            <div class="payment-section">


                <label>

                    Cash Received

                </label>


                <input
                    type="number"
                    id="cash"
                    placeholder="Enter cash amount"
                    oninput="calculateChange()"
                >


                <div class="change">

                    Change: ₱
                    <span id="change">

                        0

                    </span>

                </div>



                <button
                    class="checkout"
                    onclick="checkout()"
                >

                    CHECKOUT

                </button>


            </div>


        </div>


    </div>



    <!-- =========================
         PRODUCT MANAGEMENT MODAL
    ========================= -->

    <div
        class="modal"
        id="productModal"
    >


        <div class="modal-content">


            <div class="modal-header">


                <h2 id="formTitle">

                    Add Product

                </h2>


                <button
                    class="close-modal"
                    onclick="closeProductModal()"
                >

                    ×

                </button>


            </div>



            <!-- PRODUCT NAME -->

            <div class="form-group">


                <label>

                    Product Name

                </label>


                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Coca-Cola"
                >


            </div>



            <!-- COST PRICE -->

            <div class="form-group">


                <label>

                    Cost Price

                </label>


                <input
                    type="number"
                    id="costPrice"
                    placeholder="Example: 45"
                >


            </div>



            <!-- SELLING PRICE -->

            <div class="form-group">


                <label>

                    Selling Price

                </label>


                <input
                    type="number"
                    id="sellingPrice"
                    placeholder="Example: 70"
                >


            </div>



            <!-- BARCODE -->

            <div class="form-group">


                <label>

                    Barcode

                </label>


                <input
                    type="text"
                    id="barcode"
                    placeholder="Scan or enter barcode"
                >


            </div>



            <!-- SAVE -->

            <button
                class="save-product"
                onclick="saveProduct()"
            >

                SAVE PRODUCT

            </button>



            <!-- PRODUCT LIST -->

            <div class="product-list">


                <h3>

                    All Products

                </h3>


                <div
                    id="manageProductList"
                ></div>


            </div>


        </div>


    </div>



    <script>


        /* =========================
           PRODUCTS
        ========================= */

        let products = JSON.parse(

            localStorage.getItem("products")

        ) || [

            {
                name: "Lugaw",
                cost: 30,
                price: 50,
                barcode: "1001"
            },

            {
                name: "Goto",
                cost: 40,
                price: 60,
                barcode: "1002"
            },

            {
                name: "Tokwa",
                cost: 20,
                price: 30,
                barcode: "1003"
            },

            {
                name: "Egg",
                cost: 10,
                price: 15,
                barcode: "1004"
            }

        ];



        /* =========================
           CURRENT ORDER
        ========================= */

        let cart = [];



        /* =========================
           PRODUCT BEING EDITED
        ========================= */

        let editingProductIndex = null;



        /* =========================
           DISPLAY PRODUCTS
        ========================= */

        function displayProducts() {


            const productGrid =

                document.getElementById(
                    "productGrid"
                );


            productGrid.innerHTML = "";



            products.forEach(

                (product, index) => {


                    productGrid.innerHTML += `

                        <button
                            class="product"
                            onclick="addToCart(${index})"
                        >

                            ${product.name}

                            <span class="price">

                                ₱${product.price}

                            </span>

                        </button>

                    `;

                }

            );


        }



        /* =========================
           DISPLAY MANAGE PRODUCTS
        ========================= */

        function displayManageProducts() {


            const productList =

                document.getElementById(
                    "manageProductList"
                );


            productList.innerHTML = "";



            if (products.length === 0) {


                productList.innerHTML =

                    "<p>No products yet.</p>";


                return;

            }



            products.forEach(

                (product, index) => {


                    productList.innerHTML += `

                        <div class="manage-product-item">


                            <div class="manage-product-info">


                                <div class="manage-product-name">

                                    ${product.name}

                                </div>


                                <div class="manage-product-details">


                                    Cost: ₱${product.cost}

                                    |

                                    Selling: ₱${product.price}


                                    <br>


                                    Barcode: ${product.barcode}


                                </div>


                            </div>



                            <div>


                                <button
                                    class="edit-button"
                                    onclick="editProduct(${index})"
                                >

                                    EDIT

                                </button>



                                <button
                                    class="delete-button"
                                    onclick="deleteProduct(${index})"
                                >

                                    DELETE

                                </button>


                            </div>


                        </div>

                    `;

                }

            );


        }



        /* =========================
           ADD TO CART
        ========================= */

        function addToCart(index) {


            const product = products[index];



            const existingItem = cart.find(

                item =>

                    item.barcode === product.barcode

            );



            if (existingItem) {


                existingItem.quantity++;


            }


            else {


                cart.push({

                    name: product.name,

                    price: product.price,

                    barcode: product.barcode,

                    quantity: 1

                });


            }



            updateCart();


        }



        /* =========================
           BARCODE SCANNING
        ========================= */

        const barcodeScanner =

            document.getElementById(
                "barcodeScanner"
            );



        barcodeScanner.addEventListener(

            "keydown",

            function(event) {


                if (event.key === "Enter") {


                    event.preventDefault();


                    scanBarcode();


                }


            }

        );



        function scanBarcode() {


            const scannedBarcode =

                barcodeScanner.value.trim();



            if (!scannedBarcode) {


                return;


            }



            /* FIND PRODUCT */

            const productIndex =

                products.findIndex(

                    product =>

                        product.barcode === scannedBarcode

                );



            /* PRODUCT FOUND */

            if (productIndex !== -1) {


                addToCart(productIndex);


            }


            /* PRODUCT NOT FOUND */

            else {


                alert(

                    "Product not found!\n\n" +

                    "Barcode: " +

                    scannedBarcode

                );


            }



            /* CLEAR BARCODE */

            barcodeScanner.value = "";


            /* PREPARE FOR NEXT SCAN */

            barcodeScanner.focus();


        }



        /* =========================
           OPEN PRODUCT MODAL
        ========================= */

        function openProductModal() {


            clearProductForm();


            displayManageProducts();


            document.getElementById(
                "productModal"
            ).style.display = "flex";


        }



        /* =========================
           CLOSE PRODUCT MODAL
        ========================= */

        function closeProductModal() {


            document.getElementById(
                "productModal"
            ).style.display = "none";


            barcodeScanner.focus();


        }



        /* =========================
           CLEAR PRODUCT FORM
        ========================= */

        function clearProductForm() {


            editingProductIndex = null;



            document.getElementById(
                "formTitle"
            ).textContent = "Add Product";



            document.getElementById(
                "productName"
            ).value = "";



            document.getElementById(
                "costPrice"
            ).value = "";



            document.getElementById(
                "sellingPrice"
            ).value = "";



            document.getElementById(
                "barcode"
            ).value = "";


        }



        /* =========================
           SAVE PRODUCT
        ========================= */

        function saveProduct() {


            const name =

                document.getElementById(
                    "productName"
                ).value.trim();



            const cost = Number(

                document.getElementById(
                    "costPrice"
                ).value

            );



            const price = Number(

                document.getElementById(
                    "sellingPrice"
                ).value

            );



            const barcode =

                document.getElementById(
                    "barcode"
                ).value.trim();



            /* CHECK REQUIRED FIELDS */

            if (

                !name ||

                price <= 0 ||

                !barcode

            ) {


                alert(

                    "Please enter Product Name, Selling Price, and Barcode."

                );


                return;


            }



            /* CHECK DUPLICATE BARCODE */

            const duplicateBarcode =

                products.some(

                    (product, index) =>

                        product.barcode === barcode &&

                        index !== editingProductIndex

                );



            if (duplicateBarcode) {


                alert(

                    "This barcode already belongs to another product."

                );


                return;


            }



            /* EDIT PRODUCT */

            if (editingProductIndex !== null) {


                products[editingProductIndex] = {

                    name: name,

                    cost: cost,

                    price: price,

                    barcode: barcode

                };


                alert(

                    "Product updated successfully!"

                );


            }



            /* ADD PRODUCT */

            else {


                products.push({

                    name: name,

                    cost: cost,

                    price: price,

                    barcode: barcode

                });



                alert(

                    "Product added successfully!"

                );


            }



            /* SAVE TO LOCAL STORAGE */

            localStorage.setItem(

                "products",

                JSON.stringify(products)

            );



            /* REFRESH */

            displayProducts();

            displayManageProducts();

            clearProductForm();


        }



        /* =========================
           EDIT PRODUCT
        ========================= */

        function editProduct(index) {


            const product = products[index];



            editingProductIndex = index;



            document.getElementById(
                "formTitle"
            ).textContent = "Edit Product";



            document.getElementById(
                "productName"
            ).value = product.name;



            document.getElementById(
                "costPrice"
            ).value = product.cost;



            document.getElementById(
                "sellingPrice"
            ).value = product.price;



            document.getElementById(
                "barcode"
            ).value = product.barcode;



            document.querySelector(
                ".modal-content"
            ).scrollTop = 0;


        }



        /* =========================
           DELETE PRODUCT
        ========================= */

        function deleteProduct(index) {


            const product = products[index];



            const confirmDelete = confirm(

                "Are you sure you want to delete:\n\n" +

                product.name +

                "?"

            );



            if (!confirmDelete) {


                return;


            }



            products.splice(index, 1);



            localStorage.setItem(

                "products",

                JSON.stringify(products)

            );



            /* REMOVE FROM CART */

            cart = cart.filter(

                item =>

                    item.barcode !== product.barcode

            );



            displayProducts();

            displayManageProducts();

            updateCart();


        }



        /* =========================
           INCREASE QUANTITY
        ========================= */

        function increaseQuantity(barcode) {


            const item = cart.find(

                item =>

                    item.barcode === barcode

            );



            if (item) {


                item.quantity++;


            }



            updateCart();


        }



        /* =========================
           DECREASE QUANTITY
        ========================= */

        function decreaseQuantity(barcode) {


            const item = cart.find(

                item =>

                    item.barcode === barcode

            );



            if (item) {


                item.quantity--;



                if (item.quantity <= 0) {


                    removeItem(barcode);


                    return;


                }


            }



            updateCart();


        }



        /* =========================
           REMOVE ITEM
        ========================= */

        function removeItem(barcode) {


            cart = cart.filter(

                item =>

                    item.barcode !== barcode

            );



            updateCart();


        }



        /* =========================
           UPDATE CART
        ========================= */

        function updateCart() {


            const cartItems =

                document.getElementById(
                    "cartItems"
                );


            cartItems.innerHTML = "";


            let total = 0;



            if (cart.length === 0) {


                cartItems.innerHTML =

                    "<p>No items yet.</p>";


            }


            else {


                cart.forEach(

                    item => {


                        const itemTotal =

                            item.price *

                            item.quantity;



                        total += itemTotal;



                        cartItems.innerHTML += `

                            <div class="cart-item">


                                <div>


                                    <div class="item-name">

                                        ${item.name}

                                    </div>


                                    <div class="item-price">

                                        ₱${item.price}

                                        ×

                                        ${item.quantity}

                                    </div>


                                </div>



                                <div class="quantity-controls">


                                    <button

                                        onclick="decreaseQuantity('${item.barcode}')"

                                    >

                                        −

                                    </button>



                                    <span>

                                        ${item.quantity}

                                    </span>



                                    <button

                                        onclick="increaseQuantity('${item.barcode}')"

                                    >

                                        +

                                    </button>


                                </div>



                                <strong>

                                    ₱${itemTotal}

                                </strong>



                                <button

                                    class="remove-button"

                                    onclick="removeItem('${item.barcode}')"

                                >

                                    ×

                                </button>


                            </div>

                        `;


                    }

                );


            }



            document.getElementById(
                "total"
            ).textContent = total;



            calculateChange();


        }



        /* =========================
           CALCULATE CHANGE
        ========================= */

        function calculateChange() {


            const total = Number(

                document.getElementById(
                    "total"
                ).textContent

            );



            const cash = Number(

                document.getElementById(
                    "cash"
                ).value

            );



            const change = cash - total;



            document.getElementById(
                "change"
            ).textContent =

                change >= 0 ?

                change :

                0;


        }



        /* =========================
           CHECKOUT
        ========================= */

        function checkout() {


            if (cart.length === 0) {


                alert(

                    "Please add products first."

                );


                return;


            }



            const total = Number(

                document.getElementById(
                    "total"
                ).textContent

            );



            const cash = Number(

                document.getElementById(
                    "cash"
                ).value

            );



            if (cash < total) {


                alert(

                    "Insufficient cash."

                );


                return;


            }



            const change =

                cash - total;



            alert(

                "Payment Successful!\n\n" +

                "Total: ₱" + total +

                "\nCash: ₱" + cash +

                "\nChange: ₱" + change

            );



            /* CLEAR CART */

            cart = [];



            document.getElementById(
                "cash"
            ).value = "";



            updateCart();


            /* READY FOR NEXT CUSTOMER */

            barcodeScanner.focus();


        }



        /* =========================
           START POS
        ========================= */

        displayProducts();


        /* TRY TO KEEP SCANNER READY */

        barcodeScanner.focus();


    </script>


</body>

</html>
